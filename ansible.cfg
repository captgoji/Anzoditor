[defaults]
forks = 10
timeout = 15
retry_files_enabled = False
interpreter_python = auto_silent
callback_result_format = yaml

[ssh_connection]
# accept-new : enregistre l'empreinte d'un nouveau serveur, mais refuse si elle change ensuite
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=15 -o ServerAliveCountMax=4
