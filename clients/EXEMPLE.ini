# Modele : copier ce fichier en clients/NomDuClient.ini puis remplacer les lignes.
# Le meme fichier sert a checkApp.yml (./lancer.sh) et a audit.yml (./lancer_audit.sh).
#
# Une ligne par serveur :  nom-libre  ansible_host=IP  ansible_user=COMPTE  [profil=...]  [options]
#   - compte Windows avec un \ : entre apostrophes, ex. ansible_user='DOMAINE\compte'
#   - mots de passe :
#       mdp='...' sur la ligne du serveur, ou une fois pour tous dans [windows:vars] / [linux:vars]
#       (Linux : mdp_sudo='...' si le mot de passe sudo est different). Toujours entre apostrophes ;
#       un mot de passe contenant une apostrophe ne peut pas etre ecrit ici -> laisser vide et le saisir.
#       Sans mdp= : lancer_audit.sh en demande UN par compte (ansible_user) ; meme nom de compte mais mots de
#       passe differents (Administrateur local de VM hors domaine) : compte=NomLibre -> une question par valeur.
#       Fichier sensible : chmod 600 clients/*.ini, ne pas le copier hors de WSL ni dans OneDrive.
#   - profil (voir profils.yml) : poste, serveur, fichiers, hyperv, dc, dc_principal, auto
#       plusieurs profils separes par des virgules : profil=serveur,fichiers
#       sans profil (ou profil=auto) : detection automatique (PDC = dc_principal)
#       UN SEUL dc_principal par domaine (sinon les donnees du domaine sont collectees en double)
#   - ajustement par serveur : scripts_ajout=32 / scripts_retrait=21 (numeros, separes par des virgules)
#
# Options du framework (variables AUDIT_* en minuscules) :
#   audit_ntfs_paths='D:\Partages\Commun;\\SRV-FIC01\RH'   -> SUR LA LIGNE DU SERVEUR, entre apostrophes
#                                                             (dans [all:vars] les \ seraient alteres)
#   audit_ntfs_depth=3   audit_ntfs_dfs_depth=2   audit_ntfs_exclure='Public;Scans'
#   audit_ntfs_max_dossiers=50000   audit_groupes_replmeta=0
#   Sans audit_ntfs_paths : tous les partages SMB du serveur sont audites (mode non interactif).

[all:vars]
client=Netoptima
# Microsoft 365 (facultatif) : domaine du tenant -> lancer_audit.sh affiche un code de connexion, se connecter
# avec un compte ADMIN du client sur https://microsoft.com/devicelogin (MFA comprise), lecture seule
m365_tenant=Netoptima.onmicrosoft.com
# Google Workspace (facultatif) : domaine principal + super admin du client
#   gws_cle='~/cles/Netoptima_gws.json'  -> compte de service avec delegation au niveau du domaine (aucune intervention)
#   sans gws_cle                     -> lien de connexion a ouvrir dans le navigateur avec le super admin
# gws_domaine=Netoptima.fr
# gws_admin=admin@Netoptima.fr
audit_ntfs_depth=3

[windows]
DC01        ansible_host=192.168.10.10  ansible_user='LAB\admin-netoptima'  profil=dc_principal  mdp='MotDePasseLAB'
DC02        ansible_host=192.168.10.11  ansible_user='LAB\admin-netoptima'  profil=dc
SRV-FIC01   ansible_host=192.168.10.12  ansible_user='LAB\admin-netoptima'  profil=serveur,fichiers  audit_ntfs_paths='D:\Partages\Commun;D:\Partages\RH'
HV01        ansible_host=192.168.10.13  ansible_user='LAB\admin-netoptima'  profil=serveur,hyperv
SRV-APP01   ansible_host=192.168.10.14  ansible_user='LAB\admin-netoptima'
PC-COMPTA   ansible_host=192.168.10.50  ansible_user='LAB\admin-netoptima'  profil=poste
DC-PROD     ansible_host=10.20.0.10     ansible_user='PROD\admin-netoptima'  profil=dc_principal  mdp='MotDePassePROD'
SRV-DMZ     ansible_host=10.30.0.5      ansible_user=Administrateur  compte=srv-dmz

[linux]
SRV-candidature  ansible_host=192.168.10.5  ansible_user=admin
SRV-web          ansible_host=192.168.10.6  ansible_user=admin  mdp='MotDePasseSSH'  mdp_sudo='MotDePasseSudo'

[esxi]
# VMware, audite en lecture seule par l'API vSphere depuis la machine Ansible : sudo apt install python3-pyvmomi
#   S'il y a un vCenter : le declarer SEUL (tous ses hotes sont audites) ; sinon une ligne par ESXi isole.
#   Compte en lecture seule (role "Lecture seule") ; mot de passe demande au lancement, ou mdp='...'
#   Proxmox VE : rien a declarer ici, le mettre dans [linux] (detecte automatiquement, sudo requis)
VCENTER     ansible_host=192.168.10.30  ansible_user='audit@vsphere.local'

[reseau]
# Switchs et bornes Wi-Fi, interroges en SNMP (lecture seule) depuis la machine Ansible : sudo apt install snmp
#   type=switch | wifi (sinon detection automatique) ; marque= facultatif (deduite du SNMP)
#   snmp_communaute='...' sur la ligne, ou une fois pour toutes dans [reseau:vars]
#   SNMPv3 : snmp_version=3 snmp_v3_user=... snmp_v3_auth_pass='...' snmp_v3_priv_pass='...'
#            (snmp_v3_auth_proto=SHA snmp_v3_priv_proto=AES snmp_v3_niveau=authPriv par defaut)
#   reseau_test_ports=false : pas de test TCP 22/23/80/443 (Telnet / HTTP)
SW-CORE     ansible_host=192.168.10.2   type=switch
SW-ETAGE1   ansible_host=192.168.10.3   type=switch  snmp_communaute='AutreCommunaute'
AP-ACCUEIL  ansible_host=192.168.10.20  type=wifi

[reseau:vars]
snmp_communaute='CommunauteClient'

[unifi]
# Controleurs UniFi (UDM / UDM Pro, Cloud Key, UniFi OS Server, controleur classique), lus par leur API
# en lecture seule depuis la machine Ansible (aucun outil a installer). Une ligne par controleur :
#   ansible_user = compte LOCAL du controleur, role lecture seule ("View Only") ; un compte UI.com avec MFA
#   ne fonctionne pas. Mot de passe demande au lancement, ou mdp='...'.
#   unifi_port=11443 (UniFi OS Server) / 8443 (controleur classique) / 443 (UDM, Cloud Key) : sinon essai des trois
#   unifi_site=default : un seul site (sinon tous les sites visibles par le compte)
# Tous les switchs, bornes et passerelles UniFi du controleur sont audites : ne pas les mettre aussi dans [reseau].
UNIFI-CTRL  ansible_host=192.168.10.40  ansible_user=audit-netoptima  unifi_port=11443

# Alternative aux variables profil= : des sections du nom du profil (le serveur reste aussi dans [windows])
# [dc_principal]
# DC01
